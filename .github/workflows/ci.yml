name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra cli
      - run: uv run --extra cli ruff check . && uv run --extra cli ruff format --check .
      - if: matrix.python == '3.14'
        run: uv run --extra cli mypy
      - run: uv run --extra cli pytest -m 'not integration'
      - run: uv build && uv run --extra cli twine check dist/*

  integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agent37-live-integration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra cli
      - run: uv run --extra cli pytest -m 'integration and not llm and not slow' -v
        env:
          AGENT37_API_KEY: ${{ secrets.AGENT37_API_KEY }}
